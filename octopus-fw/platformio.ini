; pap-motion: motion firmware for the BTT Octopus V1.1 (STM32F446ZET6 or F407ZET6 by batch, 12 MHz crystal,
; 8 x TMC2209 UART). This machine's board: F446 -> env octopus_f446 (the default).
;   pio run                       -> .pio/build/octopus_f446/firmware.bin   (pio run -e octopus: F407 boards)
;   pio run -t upload             DFU: BOOT0 jumper, microSD card OUT (it blocks the ROM bootloader's USB), reset
;   or copy firmware.bin to the root of a microSD card, put it into the Octopus, power on:
;   the BTT bootloader (first 32 KiB) flashes it and renames the file to FIRMWARE.CUR.
;   From the Pi: pap-core --flash (DFU command, no jumper).
;   pio test -e native            unit tests on the PC (parser, settings, TMC frames)
; Protocol: ../protocol.md (motion part) and ../docs/superpowers/specs/2026-10-24-pi5-octopus-design.md

[platformio]
default_envs = octopus_f446

[env:octopus]
platform = ststm32
framework = arduino
; STM32F407ZET6, 144 pins, 512 KB flash. The variant's 8 MHz clock setup is replaced in src/clock.cpp (12 MHz HSE).
board = black_f407ze
; behind the 32 KiB BTT bootloader. The STM32 Arduino core reads flash_offset (link address +
; VECT_TAB_OFFSET); "board_build.offset" is ignored by it and linked everything for 0x08000000.
board_build.flash_offset = 0x8000
board_upload.offset_address = 0x08008000
upload_protocol = dfu
monitor_speed = 115200
build_flags =
	-DHSE_VALUE=12000000U
	-DUSBCON
	-DUSBD_USE_CDC
	-DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
	-DUSBD_VID=0x0483
	-DUSBD_PID=0x5740
	-DUSB_PRODUCT_STRING="\"pap-motion\""
	-DSERIAL_RX_BUFFER_SIZE=512
	-DSERIAL_TX_BUFFER_SIZE=512
	-O2
	-Wl,-u,_printf_float
	-Wall
build_src_flags = -std=gnu++17
; microSD slot (SDIO): read-only access for the Pi (src/sdcard.h)
lib_deps =
	stm32duino/STM32duino STM32SD@^1.5.0
	https://github.com/stm32duino/FatFs.git#4.0.0
build_unflags = -Os -std=gnu++14

; Octopus V1.1 with an STM32F446ZET6 (the chip is printed on it; this machine's board): same pins,
; other USB core - the F407 build runs on it but never shows up on USB.
[env:octopus_f446]
extends = env:octopus
board = nucleo_f446ze
upload_protocol = dfu

[env:native]
platform = native
test_framework = unity
build_src_filter = -<*> +<proto/args.cpp> +<proto/out.cpp> +<settings.cpp> +<tmc_frame.cpp>
build_flags = -std=gnu++17 -DPAP_NATIVE -Isrc
test_build_src = yes
